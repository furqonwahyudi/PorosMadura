server {
    listen 80;
    server_name localhost;
    client_max_body_size 50M;

    # Deteksi crawler media sosial & bot pencari
    set $is_crawler 0;
    if ($http_user_agent ~* "facebookexternalhit|twitterbot|whatsapp|telegrambot|slackbot|discordbot|googlebot|bingbot") {
        set $is_crawler 1;
    }

    # Jika dikunjungi oleh crawler bot, alihkan URL artikel dinamis ke endpoint share-preview backend
    if ($is_crawler = 1) {
        # Mengabaikan asset yang memiliki titik (misal .js, .css, .png) & /api
        rewrite ^/([^/.]+)/([^/.]+)/?$ /api/articles/$2/share-preview last;
        rewrite ^/([^/.]+)/([^/.]+)/([^/.]+)/?$ /api/articles/$3/share-preview last;
    }

    # Jangan cache file HTML utama (index.html) agar deteksi crawler bot selalu masuk ke origin (VPS)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Cache assets statis (JS, CSS, gambar, fonts) untuk performa loading yang kencang
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf|webp)$ {
        root /usr/share/nginx/html;
        expires 1M;
        access_log off;
        add_header Cache-Control "public, no-transform";
    }

    # Reverse proxy ke container backend di port 3001
    location /api {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Reverse proxy folder uploads (jika ada file diunggah di backend)
    location /uploads {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
    }
}
