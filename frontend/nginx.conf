server {
    listen 80;
    server_name localhost;

    # Deteksi crawler media sosial & bot pencari
    set $is_crawler 0;
    if ($http_user_agent ~* "facebookexternalhit|twitterbot|whatsapp|telegrambot|slackbot|discordbot|googlebot|bingbot") {
        set $is_crawler 1;
    }

    # Jika dikunjungi oleh crawler bot, alihkan URL artikel dinamis ke endpoint share-preview backend
    if ($is_crawler = 1) {
        # Mengabaikan asset yang memiliki titik (misal .js, .css, .png) & /api
        rewrite ^/([^/.]+)/([^/.]+)/?$ /api/articles/$2/share-preview last;
        rewrite ^/([^/.]+)/([^/.]+)/([^/.]+)/?$ /api/articles/$3/share-preview last;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy ke container backend di port 3001
    location /api {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Reverse proxy folder uploads (jika ada file diunggah di backend)
    location /uploads {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
    }
}
