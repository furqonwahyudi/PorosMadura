version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: porosmadura_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mysecretpassword}
      POSTGRES_DB: ${DB_NAME:-porosmadura}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: porosmadura_backend
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-mysecretpassword}@db:5432/${DB_NAME:-porosmadura}?schema=public
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtsecretkey}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-supersecretjwtrefreshsecretkey}
      PORT: 3001
      NODE_ENV: production
    command: sh -c "npx prisma db push && node dist/server.js"
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: porosmadura_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
    driver: local
  uploads:
    driver: local
